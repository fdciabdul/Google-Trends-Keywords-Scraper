name: Reforestation

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 0,12 * * *'

permissions:
  contents: write

jobs:
  reforestation:
    runs-on: ubuntu-latest
    steps:
      - name: Set global directory
        run: git config --global --add safe.directory /github/workspace
      - uses: actions/checkout@v3
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Modify last update
        run: |
          d=`date '+%Y-%m-%dT%H:%M:%SZ'`
          echo $d > LAST_UPDATED

      - name: Commit changes
        run: |
          git config --local user.email "bagusbudisatoto2001@gmail.com"
          git config --local user.name "bagussatoto"
          git add -A

          arr[0]="feat: 🎉 reforestation"
          arr[1]="feat: 🌳 reforestation"
          arr[2]="feat: ✅ reforestation"
          arr[3]="feat: 🌲 reforestation"

          rand=$(($RANDOM % ${#arr[@]}))

          # Kedua akun hijau bersamaan (singkron) dalam 1 commit
          git commit -m "${arr[$rand]}" -m "Co-authored-by: bagussatoto1 <tegalsariromansa1@gmail.com>"

      - name: GitHub Push
        uses: ad-m/github-push-action@master
        with:
          branch: main
          force: true
          directory: '.'
          github_token: ${{ secrets.GITHUB_TOKEN }}