name: Reforestation

on:
  push:
    branches:
      - master

  schedule:
    - cron: '0 0,12 * * *'

jobs:
  reforestation:
    runs-on: ubuntu-latest
    steps:
      - name: Set global directory
        run: git config --global --add safe.directory /github/workspace
      - uses: actions/checkout@v3
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Modify last update
        run: |
          d=`date '+%Y-%m-%dT%H:%M:%SZ'`
          echo $d > LAST_UPDATED

      - name: Commit changes
        run: |
          users[0]="bagussatoto:bagusbudisatoto2001@gmail.com"
          users[1]="bagussatoto1:tegalsariromansa1@gmail.com"
          rand_u=$[$RANDOM % ${#users[@]}]
          IFS=":" read -r git_name git_email <<< "${users[$rand_u]}"

          git config --local user.email "$git_email"
          git config --local user.name "$git_name"
          git add -A

          arr[0]="feat: 🎉 reforestation"
          arr[1]="feat: 🌳 reforestation"
          arr[2]="feat: ✅ reforestation"
          arr[3]="feat: 🌲 reforestation"

          rand=$[$RANDOM % ${#arr[@]}]

          git commit -m "${arr[$rand]}"

      - name: GitHub Push
        uses: ad-m/github-push-action@v0.6.0
        with:
          force: true
          directory: '.'
          github_token: ${{ secrets.GITHUB_TOKEN }}