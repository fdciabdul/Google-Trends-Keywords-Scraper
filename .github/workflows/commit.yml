name: Auto commit

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *" # Every 30 minutes

permissions:
  contents: write

jobs:
  auto_commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3      
        with:
         persist-credentials: false
         fetch-depth: 0

      - name: Modify last update
        run: |
          d=`date '+%Y-%m-%dT%H:%M:%SZ'`
          echo $d > LAST_UPDATED
          
      - name: Commit changes
        run: |
          git config --local user.email "bagusbudisatoto2001@gmail.com"
          git config --local user.name "bagussatoto"
          git add -A
          
          arr[0]="chore(bot): 😂 auto commit"
          arr[1]="chore(bot): 😱 auto commit"
          arr[2]="chore(bot): 👿 auto commit"
          arr[3]="chore(bot): 💩 auto commit"
          arr[4]="chore(bot): 🙏 auto commit"
          arr[5]="chore(bot): 🙈 auto commit"
          arr[6]="chore(bot): 🐐 auto commit"
          arr[7]="chore(bot): 🤖 auto commit"
          arr[8]="chore(bot): 🟩 auto commit"
          arr[9]="chore(bot): 👻 auto commit"
          
          rand=$(($RANDOM % ${#arr[@]}))
          
          # Menggunakan Co-authored-by resmi GitHub agar KEDUA akun hijau bersamaan (singkron) dalam 1 commit
          git commit -m "${arr[$rand]}" -m "Co-authored-by: bagussatoto1 <tegalsariromansa1@gmail.com>"
          
      - name: GitHub Push
        uses: ad-m/github-push-action@master
        with:
          branch: main
          force: true
          directory: "."
          github_token: ${{ secrets.GITHUB_TOKEN }}