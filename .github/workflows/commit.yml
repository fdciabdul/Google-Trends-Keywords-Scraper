name: Auto commit

on:

  push:
    branches:
      - main
      - master
      
  schedule:
  - cron: "*/30 * * * *" # Every 30 minutes

jobs:
  auto_commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3      
        with:
         persist-credentials: false
         fetch-depth: 0

      - name: Modify last update
        run: |
          d=`date '+%Y-%m-%dT%H:%M:%SZ'`
          echo $d > LAST_UPDATED
          
      - name: Commit changes
        run: |
          # Rotasi acak antara kedua akun agar keduanya terhitung aktif
          users[0]="bagussatoto:bagusbudisatoto2001@gmail.com"
          users[1]="bagussatoto1:tegalsariromansa1@gmail.com"
          rand_u=$[$RANDOM % ${#users[@]}]
          IFS=":" read -r git_name git_email <<< "${users[$rand_u]}"

          git config --local user.email "$git_email"
          git config --local user.name "$git_name"
          git add -A
          
          arr[0]="chore(bot): 😂 auto commit"
          arr[1]="chore(bot): 😱 auto commit"
          arr[2]="chore(bot): 👿 auto commit"
          arr[3]="chore(bot): 💩 auto commit"
          arr[4]="chore(bot): 🙏 auto commit"
          arr[5]="chore(bot): 🙈 auto commit"
          arr[6]="chore(bot): 🐐 auto commit"
          arr[7]="chore(bot): 🤖 auto commit"
          arr[8]="chore(bot): 🟩 auto commit"
          arr[9]="chore(bot): 👻 auto commit"
          
          rand=$[$RANDOM % ${#arr[@]}]
          
          git commit -m "${arr[$rand]}"
          
      - name: GitHub Push
        uses: ad-m/github-push-action@master
        with:
          force-with-lease: true
          directory: "."
          github_token: ${{ secrets.GITHUB_TOKEN }}